name: Community WASM

on:
  push:
    branches: [feat/resolutions-transitions-languages]
    paths: ["rust/**", "Cargo.toml", "Cargo.lock", ".github/workflows/community-wasm.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      - name: Test shared editing logic
        run: cargo test -p time --locked
      - name: Build browser WASM
        run: cargo build -p opencut-wasm --release --target wasm32-unknown-unknown --locked
      - name: Generate matching JavaScript bindings
        run: |
          curl -fL https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.116/wasm-bindgen-0.2.116-x86_64-unknown-linux-musl.tar.gz -o /tmp/wasm-bindgen.tar.gz
          tar -xzf /tmp/wasm-bindgen.tar.gz -C /tmp
          mkdir -p vendor/opencut-wasm
          /tmp/wasm-bindgen-0.2.116-x86_64-unknown-linux-musl/wasm-bindgen target/wasm32-unknown-unknown/release/opencut_wasm.wasm --target bundler --out-dir vendor/opencut-wasm
      - uses: actions/upload-artifact@v4
        with:
          name: community-wasm
          path: vendor/opencut-wasm

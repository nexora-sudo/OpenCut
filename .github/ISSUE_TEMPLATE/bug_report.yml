{
  "name": "Bug report / Relatar bug",
  "description": "Report a reproducible problem in this community fork.",
  "title": "[Bug] ",
  "labels": ["bug", "needs-triage"],
  "body":
    [
      {
        "type": "markdown",
        "attributes":
          {
            "value": "This is the independent nexora-sudo community fork of OpenCut Classic. You may write in Português, English or 简体中文. Search existing issues first. Do not include private media, credentials or personal data.",
          },
      },
      {
        "type": "textarea",
        "id": "problem",
        "attributes": { "label": "What happened? / O que aconteceu?" },
        "validations": { "required": true },
      },
      {
        "type": "textarea",
        "id": "steps",
        "attributes":
          {
            "label": "Steps to reproduce / Como reproduzir",
            "placeholder": "1. Open a project\n2. ...\n3. Observe the error",
          },
        "validations": { "required": true },
      },
      {
        "type": "textarea",
        "id": "expected",
        "attributes": { "label": "Expected result / Resultado esperado" },
        "validations": { "required": true },
      },
      {
        "type": "input",
        "id": "version",
        "attributes":
          {
            "label": "Version or commit / Versão ou commit",
            "description": "Include the commit, release or website URL you tested.",
          },
        "validations": { "required": true },
      },
      {
        "type": "input",
        "id": "environment",
        "attributes":
          {
            "label": "Operating system and browser / Sistema e navegador",
            "description": "Include browser version; for example Windows 11, Chrome 140.",
          },
        "validations": { "required": true },
      },
      {
        "type": "dropdown",
        "id": "language",
        "attributes":
          {
            "label": "Interface language / Idioma",
            "options": ["Português (Brasil)", "简体中文", "English"],
          },
        "validations": { "required": true },
      },
      {
        "type": "textarea",
        "id": "evidence",
        "attributes":
          {
            "label": "Screenshots, logs or sample / Imagens, logs ou exemplo",
            "description": "Optional: use a small non-private sample. Remove secrets and personal details from logs.",
          },
        "validations": { "required": false },
      },
    ],
}

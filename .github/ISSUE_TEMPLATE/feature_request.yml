{
  "name": "Feature request / Sugerir funcionalidade",
  "description": "Suggest a feature or improvement for this community fork.",
  "title": "[Feature] ",
  "labels": ["enhancement", "needs-triage"],
  "body":
    [
      {
        "type": "markdown",
        "attributes":
          {
            "value": "This is the independent nexora-sudo community fork of OpenCut Classic. You may write in Português, English or 简体中文. Search existing issues first. Do not include private media, credentials or personal data.",
          },
      },
      {
        "type": "textarea",
        "id": "problem",
        "attributes":
          {
            "label": "What problem would this solve? / Qual problema resolveria?",
          },
        "validations": { "required": true },
      },
      {
        "type": "textarea",
        "id": "solution",
        "attributes":
          { "label": "Suggested behavior / Como deveria funcionar?" },
        "validations": { "required": true },
      },
      {
        "type": "textarea",
        "id": "alternatives",
        "attributes": { "label": "Alternatives / Alternativas" },
        "validations": { "required": false },
      },
      {
        "type": "textarea",
        "id": "examples",
        "attributes": { "label": "Examples or mockups / Exemplos ou imagens" },
        "validations": { "required": false },
      },
      {
        "type": "dropdown",
        "id": "contribution",
        "attributes":
          {
            "label": "Would you like to help? / Gostaria de ajudar?",
            "options":
              [
                "Sharing an idea / Apenas sugerindo",
                "Testing / Testando",
                "Design or translation / Design ou tradução",
                "Implementation / Implementação",
              ],
          },
        "validations": { "required": false },
      },
    ],
}
